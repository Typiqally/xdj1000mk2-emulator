[package]
name = "xdj-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
default-run = "xdj-ui"

[dependencies]
xdj-catalog = { path = "../catalog" }
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
rfd = "=0.17.2"
image = { version = "=0.25.9", default-features = false, features = ["png"] }

tempfile = "=3.27.0"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.21.1", default-features = false }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem"] }

[[bin]]
name = "xdj-ui-fixture"
path = "tests/support/fixture.rs"
test = false
bench = false
